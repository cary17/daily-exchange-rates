name: Fetch Mastercard

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD); blank means today in Beijing'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive); blank means start date'
        required: false
        default: ''
        type: string
      interval:
        description: 'Per-session request interval in seconds (finite, >= 0)'
        required: false
        default: '0.3'
        type: string
      shards:
        description: 'Parallel shard jobs; each job uses its own runner and egress address'
        required: false
        default: '9'
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-mastercard
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      start: ${{ steps.plan.outputs.start }}
      end: ${{ steps.plan.outputs.end }}
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Resolve dates and shard plan
        id: plan
        env:
          START_INPUT: ${{ inputs.start_date }}
          END_INPUT: ${{ inputs.end_date }}
          SHARDS: ${{ inputs.shards || '9' }}
        run: |
          python - <<'PY'
          import json
          import os

          from exchange_rates.cli import dates

          first, last = dates(os.environ.get("START_INPUT", ""),
                              os.environ.get("END_INPUT", ""))
          count = int(os.environ.get("SHARDS", "9"))
          if not 1 <= count <= 32:
              raise SystemExit("shards must be between 1 and 32")
          matrix = {"include": [{"shard": index} for index in range(count)]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"start={first.isoformat()}\n")
              out.write(f"end={last.isoformat()}\n")
              out.write("matrix=" + json.dumps(matrix) + "\n")
          print(f"Plan: {first} through {last}; {count} shards")
          PY

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Collect shard
        env:
          START_DATE: ${{ needs.prepare.outputs.start }}
          END_DATE: ${{ needs.prepare.outputs.end }}
          REQUEST_INTERVAL: ${{ inputs.interval || '0.3' }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shards || '9' }}
        run: |
          python -m exchange_rates fetch-shard \
            --provider mastercard \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --interval "$REQUEST_INTERVAL" \
            --shard-index "$SHARD_INDEX" \
            --shard-count "$SHARD_COUNT" \
            --shard-dir "$RUNNER_TEMP/shards" \
            --diagnostics-dir "$RUNNER_TEMP/exchange-rate-diagnostics"
      - name: Upload shard bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mastercard-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards
          if-no-files-found: warn
          retention-days: 3
      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mastercard-diag-${{ matrix.shard }}
          path: ${{ runner.temp }}/exchange-rate-diagnostics
          if-no-files-found: warn
          retention-days: 7

  plan-retry:
    needs: [prepare, shard]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_retries: ${{ steps.plan.outputs.has_retries }}
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Download first-pass bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: mastercard-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Plan missing shards and dates
        id: plan
        env:
          START_DATE: ${{ needs.prepare.outputs.start }}
          END_DATE: ${{ needs.prepare.outputs.end }}
          SHARD_COUNT: ${{ inputs.shards || '9' }}
        run: |
          python .github/scripts/plan-shard-retries.py \
            --provider mastercard \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --shard-count "$SHARD_COUNT" \
            --shard-dir "$RUNNER_TEMP/shards"

  retry:
    needs: [prepare, plan-retry]
    if: ${{ !cancelled() && needs.plan-retry.result == 'success' && needs.plan-retry.outputs.has_retries == 'true' }}
    uses: ./.github/workflows/retry-shards.yml
    with:
      provider: mastercard
      matrix: ${{ needs.plan-retry.outputs.matrix }}
      shards: ${{ inputs.shards || '9' }}
      interval: ${{ inputs.interval || '0.3' }}

  merge:
    needs: [prepare, shard, plan-retry, retry]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.plan-retry.result == 'success' && (needs.retry.result == 'success' || needs.retry.result == 'skipped' || needs.retry.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: data-branch-writes
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          git lfs version
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Download shard bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: mastercard-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Download retry bundles over first-pass results
        if: ${{ needs.plan-retry.outputs.has_retries == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: mastercard-retry-[0-9]*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Verify, publish and merge shards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          START_DATE: ${{ needs.prepare.outputs.start }}
          END_DATE: ${{ needs.prepare.outputs.end }}
        run: |
          python -m exchange_rates merge-shards \
            --provider mastercard \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --shard-dir "$RUNNER_TEMP/shards" \
            --data-dir "$RUNNER_TEMP/rates-data" \
            --diagnostics-dir "$RUNNER_TEMP/exchange-rate-diagnostics" \
            --publish --remote origin --branch data
      - name: Upload diagnostics
        if: ${{ always() }}
        id: diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mastercard-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exchange-rate-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Link diagnostics
        if: ${{ always() && steps.diagnostics.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf '\n[Detailed diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
