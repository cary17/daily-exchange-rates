name: Archive

on:
  schedule:
    - cron: '0 0 3 * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch-writes
  queue: max
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Archive and publish
        run: |
          python -m exchange_rates archive \
            --data-dir "$RUNNER_TEMP/rates-data" \
            --publish --remote origin --branch data
