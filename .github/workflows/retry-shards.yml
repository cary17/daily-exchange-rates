name: Retry missing shards

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      matrix:
        required: true
        type: string
      shards:
        required: true
        type: string
      interval:
        required: true
        type: string

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Retry missing dates
        env:
          PROVIDER: ${{ inputs.provider }}
          MISSING_DATES: ${{ matrix.dates }}
          REQUEST_INTERVAL: ${{ inputs.interval }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shards }}
        run: |
          status=0
          for target in $MISSING_DATES; do
            python -m exchange_rates fetch-shard \
              --provider "$PROVIDER" \
              --start-date "$target" \
              --end-date "$target" \
              --interval "$REQUEST_INTERVAL" \
              --shard-index "$SHARD_INDEX" \
              --shard-count "$SHARD_COUNT" \
              --shard-dir "$RUNNER_TEMP/shards" \
              --diagnostics-dir "$RUNNER_TEMP/exchange-rate-diagnostics/$target" \
              || status=1
          done
          exit "$status"
      - name: Upload retry bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.provider }}-retry-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards
          if-no-files-found: error
          retention-days: 3
      - name: Upload retry diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.provider }}-retry-diag-${{ matrix.shard }}
          path: ${{ runner.temp }}/exchange-rate-diagnostics
          if-no-files-found: warn
          retention-days: 7
