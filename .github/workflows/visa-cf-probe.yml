name: Visa CF probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install browser stack
        run: |
          python -m pip install --quiet playwright curl_cffi
          python -m playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends xvfb
      - name: Probe Cloudflare challenge and cookie replay
        env:
          VISA_PAGE: "https://www.visa.com.sg/support/consumer/travel-support/exchange-rate-calculator.html"
          VISA_API: "https://www.visa.com.sg/cmsapi/fx/rates?amount=1&fee=0&utcConvertedDate=11%2F17%2F2026&exchangedate=11%2F17%2F2026&fromCurr=USD&toCurr=CNY"
        run: xvfb-run -a python .github/probe_visa_cf.py
