name: Fetch UnionPay

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD); blank means today in Beijing'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive); blank means start date'
        required: false
        default: ''
        type: string
      interval:
        description: 'Per-session request interval in seconds (finite, >= 0)'
        required: false
        default: '0.3'
        type: string

permissions:
  contents: write

concurrency:
  group: data-branch-writes
  queue: max
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          git lfs version
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Fetch and publish UnionPay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          REQUEST_INTERVAL: ${{ inputs.interval || '0.3' }}
        run: |
          python -m exchange_rates fetch \
            --provider unionpay \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --interval "$REQUEST_INTERVAL" \
            --data-dir "$RUNNER_TEMP/rates-data" \
            --diagnostics-dir "$RUNNER_TEMP/exchange-rate-diagnostics" \
            --publish --remote origin --branch data
      - name: Upload diagnostics
        if: ${{ always() }}
        id: diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unionpay-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exchange-rate-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Link diagnostics
        if: ${{ always() && steps.diagnostics.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf '\n[Detailed diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
