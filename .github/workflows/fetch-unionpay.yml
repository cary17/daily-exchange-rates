name: Fetch UnionPay

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD); blank means today in Beijing'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive); blank means start date'
        required: false
        default: ''
        type: string
      interval:
        description: 'Per-session request interval in seconds (finite, >= 0)'
        required: false
        default: '0.3'
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-unionpay
  queue: max
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      has_data: ${{ steps.bundle.outputs.has_data }}
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Collect UnionPay
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          REQUEST_INTERVAL: ${{ inputs.interval || '0.3' }}
        run: |
          python -m exchange_rates fetch \
            --provider unionpay \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --interval "$REQUEST_INTERVAL" \
            --data-dir "$RUNNER_TEMP/collected" \
            --diagnostics-dir "$RUNNER_TEMP/exchange-rate-diagnostics"
      - name: Locate collected days
        if: ${{ !cancelled() }}
        id: bundle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "collected/history"
          has_data = any(root.glob("????/??/unionpay/*.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"has_data={str(has_data).lower()}\n")
          PY
      - name: Upload collected days
        if: ${{ !cancelled() && steps.bundle.outputs.has_data == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unionpay-collected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collected
          if-no-files-found: error
          retention-days: 3
      - name: Upload diagnostics
        if: ${{ always() }}
        id: diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unionpay-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exchange-rate-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Link diagnostics
        if: ${{ always() && steps.diagnostics.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf '\n[Detailed diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: fetch
    if: ${{ !cancelled() && needs.fetch.outputs.has_data == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: data-branch-writes
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: |
          git lfs version
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Download collected days
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: unionpay-collected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collected
      - name: Publish collected UnionPay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish-unionpay.py \
            --collected-dir "$RUNNER_TEMP/collected" \
            --data-dir "$RUNNER_TEMP/rates-data"
